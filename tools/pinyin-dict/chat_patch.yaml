# Chat / colloquial patch for the on-device pinyin table.
#
# Not scraped from Sogou or copied from GPL Rime schemes. Entries are everyday
# WeChat-style expressions that Wanxiang either never listed or pruned below the
# short-word floor. Pinyin is space-separated, tones optional (stripped at build).
# Weights are synthetic: high enough to surface in the bar, low enough not to
# outrank real corpus heavyweights like 可以 / 不是.
#
# Format: word <tab> pinyin <tab> weight

